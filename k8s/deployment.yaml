apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-eks-gitops
  labels:
    app: python-eks-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-eks-gitops
  template:
    metadata:
      labels:
        app: python-eks-gitops
    spec:
      containers:
        - name: python-eks-gitops
          image: 755729228993.dkr.ecr.ap-south-1.amazonaws.com/python-eks-gitops:f62c14640c16ed9eddbde22381720cd43311f44b
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"