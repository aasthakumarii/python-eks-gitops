apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: python-eks-gitops
  namespace: default

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:755729228993:certificate/5dff164e-992d-49bf-a399-2e2e7cc19cea

    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: alb

  rules:
    - host: app.alffino.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-eks-gitops
                port:
                  number: 80