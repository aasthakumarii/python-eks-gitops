name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: python-eks-gitops
  ECR_REGISTRY: 755729228993.dkr.ecr.ap-south-1.amazonaws.com


jobs:

  # --------------------------------------------------
  # 1. Python tests
  # --------------------------------------------------
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest


  # --------------------------------------------------
  # 2. Build + Trivy security scan
  # --------------------------------------------------
  build-and-scan:
    name: Build and Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"


  # --------------------------------------------------
  # 3. Push image to ECR
  # --------------------------------------------------
  push-to-ecr:
    name: Push Image to ECR
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::755729228993:role/GitHubActions-ECR-Push
          aws-region: ${{ env.AWS_REGION }}
          audience: https://github.com/aasthakumarii

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


  # --------------------------------------------------
  # 4. Trigger Terraform only after CI succeeds
  # --------------------------------------------------
  trigger-terraform:
    name: Trigger Terraform
    needs: push-to-ecr

    # Terraform should only automatically run after
    # a successful push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Terraform workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run terraform.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f action=create

      - name: Terraform workflow triggered
        run: |
          echo "Terraform workflow has been triggered."
          echo "Terraform will create/update the AWS infrastructure."
          